version: '3.8'

services:
  saasc-postgres:
    image: postgres:16-alpine
    container_name: saasc-postgres-db
    restart: always
    environment:
      POSTGRES_USER: saasc_admin
      POSTGRES_PASSWORD: saasc_secure_password_2026
      POSTGRES_DB: saasc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_saasc_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - saasc-network

  saasc-redis:
    image: redis:7-alpine
    container_name: saasc-redis-cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - saasc-network

volumes:
  postgres_saasc_data:

networks:
  saasc-network:
    driver: bridge